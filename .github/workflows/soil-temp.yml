name: Render soil temperature map

# GFS updates 4x/day (00/06/12/18 UTC) and its 0.25-degree surface file
# typically isn't posted until ~3.5-4 hours after the cycle time, so this
# runs a bit after each one — the script itself also falls back to older
# cycles if the newest isn't available yet.
on:
  schedule:
    - cron: "30 4,10,16,22 * * *"
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/python-deps.txt

      - name: Render and upload
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/render_soil_temp.py
